<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
    body {
        background-color:black;
        justify-content: center;
        align-items: center;
    }
        
        .image {
            position: relative;
            width: min(95vw, 600px);
            aspect-ratio: 1 / 1;
        }

        .image img {
            position: absolute;
            inset: 0;
            display: flex;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease;
        }


        .image .hover {
            opacity: 0;
        }

        .image:hover .hover {
            opacity: 1;
        }

        .image:hover .default {
            opacity: 0;
        }

</style>

</head>

<body>

<div class="image">
    <img src="./reveal1.png" class="default" alt="">
    <img src="./reveal2.png" class="hover" alt="">
</div>


</body>
</html>
